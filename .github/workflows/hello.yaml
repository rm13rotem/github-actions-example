name: hello-actions

on:
  push:
  workflow_dispatch: 

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Print message
        run: echo "Hello GitHub Actions"
        
  build:
    runs-on: ubuntu-latest
    needs: [ hello ]
    steps:
      - name: Print message
        run: echo "build image"

  marketplace:
    runs-on: ubuntu-latest
    needs: hello
    steps:
      - name: Print message
        uses: actions/hello-world-javascript-action@main
        with:
          who-to-greet: "Github actions student"

  show-secret:
    runs-on: ubuntu-latest
    environment: production
    needs: hello
    steps:
      - name: Print Variable
        run: echo ${{ vars.JB_DEMO_USER }}
      - name: Print Secret
        run: echo ${{ secrets.DOCKERHUB_USERNAME }}

